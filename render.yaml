services:
  - type: web
    name: x402-doctor
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SOLANA_RPC_URL
        sync: false
      - key: AGENT_PAYOUT_WALLET
        sync: false
      - key: AGENT_PAYOUT_WALLET_SOLANA
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: USAGE_LOG_TOKEN
        sync: false
      - key: USAGE_LOG_REPO
        value: Fizzl13/usage-log
      - key: ADMIN_PASSWORD
        sync: false
      - key: X402_TRUST_TXT # x402-trust.com provider verification line (public key; optional)
        sync: false
