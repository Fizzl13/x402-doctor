services:
  - type: web
    name: x402-doctor
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SOLANA_RPC_URL
        sync: false
      - key: AGENT_PAYOUT_WALLET
        sync: false
      - key: AGENT_PAYOUT_WALLET_SOLANA
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
