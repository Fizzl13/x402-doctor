name: Trust City of the week

# Renders this week's x402 Trust City as one 1080p still in Blender (media/city/city_hd.py, the scene of /trust/city's
# video), from the free atlas of today's scan (media/city/build_sellers.py), and adds the caption and a post text
# with this week's numbers (media/city/week_card.py). The result is an artifact (trust-city-week: the JPG, the bare
# PNG, post.txt, sellers.json); nothing is published or posted from here. Every Monday at 07:17 UTC, after the
# day's scan. Frits asked for it on 20 Nov 2026.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      samples:
        description: "Cycles samples (64 = the HD video's quality)"
        default: "64"

permissions:
  contents: read

concurrency:
  group: trust-city-week
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Blender 4.5 (bpy) and fonts
        run: |
          # bpy 4.5 LTS as a Python module; the compositor code in city_hd.py is written for 4.5 (5.x changed it).
          pip install --quiet bpy==4.5.*
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter ffmpeg libxi6 libxkbcommon0 libsm6 libgl1 > /dev/null
      - name: Today's sellers
        run: |
          curl -sf --compressed --retry 3 -o atlas.json https://x402-doctor.fizzl.eu/api/trust/atlas
          python3 media/city/build_sellers.py atlas.json media/city/sellers.json
      - name: Render (1920x1080, frame 150 of the orbit)
        run: |
          mkdir -p out
          python3 media/city/city_hd.py -- --still 150 --samples "${{ inputs.samples || '64' }}" --out "$PWD/out/trust-city-week.png"
          test -s out/trust-city-week.png
      - name: Caption and post text
        run: |
          python3 media/city/week_card.py atlas.json media/city/sellers.json out/trust-city-week.png out/trust-city-week.jpg out/post.txt
          cp media/city/sellers.json out/
          { echo '## Trust City of the week'; echo; echo '```'; cat out/post.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: trust-city-week
          path: out/
          retention-days: 30
