name: token verdict live smoke (one-off research)
on:
  push:
    branches: [research/x402-market]
    paths: ['scripts/token-smoke.mjs', '.github/workflows/token-smoke.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: Fizzl13/presign-guard, ref: claude/x402-agents-solana-payments-nceg9b, path: pg }
      - run: npm ci --omit=dev
        working-directory: pg
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/token-smoke.mjs
