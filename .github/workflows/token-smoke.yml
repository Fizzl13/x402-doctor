name: token verdict live smoke (one-off research)
on:
  push:
    branches: [research/x402-market]
    paths: ['scripts/token-smoke.mjs', '.github/workflows/token-smoke.yml']
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Fetch the crowding-check result (x402-examples run 36250302508)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh run download 36250302508 -R Fizzl13/x402-examples -n crowding-check-BTC -D crowding
      - run: node scripts/token-smoke.mjs
