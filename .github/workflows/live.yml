name: Live check

# Dogfooding: x402-doctor diagnoses its own paid API on Render, plus the
# discovery documents. Read-only; it never pays.
on:
  schedule:
    - cron: "37 6 * * *" # daily, 06:37 UTC
  workflow_dispatch: {}

env:
  SERVICE: https://x402-doctor.onrender.com

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Render's free tier may be asleep; wake it before checking.
      - run: curl -s -o /dev/null --retry 5 --retry-delay 10 --max-time 90 "$SERVICE/api/health"
      - name: Paid API configured
        run: |
          curl -sf "$SERVICE/api/health" | tee health.json
          node -e 'const h=require("./health.json"); if(!h.paid) { console.error("paid API not configured: set AGENT_PAYOUT_WALLET / AGENT_PAYOUT_WALLET_SOLANA"); process.exit(1) } console.log("\npaid:", JSON.stringify(h.paid))'
      - name: Discovery documents
        run: |
          curl -sf "$SERVICE/.well-known/x402"; echo
          curl -sf "$SERVICE/openapi.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const op=JSON.parse(s).paths["/api/v1/diagnose"]?.get; if(!op?.["x-payment-info"]) {console.error("no x-payment-info"); process.exit(1)} console.log("openapi ok:", JSON.stringify(op["x-payment-info"]))})'
      - name: Diagnose the paid API with x402-doctor itself
        run: node bin/x402-doctor.js "$SERVICE/api/v1/diagnose"
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
