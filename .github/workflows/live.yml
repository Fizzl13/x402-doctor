name: Live check
# Temporary research branch: one-off x402 market data pull. Not for merge.
on:
  workflow_dispatch: {}
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/market-research.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: research
          path: research-out
