name: Explainer video

# Produces the x402 Doctor explainer video: a neural voice (Kokoro, open
# weights) reads media/explainer/script.json, a real browser records the live
# pages timed to the voice, ffmpeg mixes both into an MP4 with captions.
# Download the result from the run's "explainer-video" artifact.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which video: script.json (the explainer) or fix.json (the paid-fix update)"
        type: choice
        options: [script.json, fix.json]
        default: script.json
      voice:
        description: "Kokoro voice (e.g. af_heart, af_bella, am_michael, am_fenrir, bf_emma, bm_george)"
        required: false
        default: "af_heart"
      speed:
        description: "Speaking speed (1.0 = normal)"
        required: false
        default: "1.0"

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: media/explainer
    env:
      SCRIPT: ${{ github.event.inputs.script || 'script.json' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Voice (Kokoro)
        run: |
          pip install -q kokoro-onnx soundfile numpy
          curl -fsSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fsSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          python tts.py --engine kokoro --voice "${{ github.event.inputs.voice || 'af_heart' }}" --speed "${{ github.event.inputs.speed || '1.0' }}"
      - name: Browser
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Wake the live services
        run: |
          for u in https://x402-doctor.onrender.com/api/health https://ichimoku-signal.onrender.com/ https://x402-doctor.onrender.com/api/trust/summary; do
            curl -s -o /dev/null --retry 6 --retry-delay 10 --retry-all-errors --max-time 90 "$u" || true
          done
      - name: Record
        run: node record.js
      - name: Mix and encode
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          python build.py
      - name: Contact sheet (one frame per scene)
        run: |
          NAME=$(python -c "import json,os;print(json.load(open(os.environ['SCRIPT'])).get('output','x402-doctor-explainer'))")
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          i=0
          for t in $(python -c "import json;t=json.load(open('out/timeline.json'));print(' '.join(str(round(s['start']+s['duration']*0.75,1)) for s in t['segments']))"); do
            ffmpeg -loglevel error -y -ss "$t" -i "out/$NAME.mp4" -frames:v 1 -update 1 -vf scale=640:-1 "out/f$i.jpg"; i=$((i+1))
          done
          ffmpeg -loglevel error -y -framerate 1 -i out/f%d.jpg -vf "tile=3x$(( (i + 2) / 3 ))" -frames:v 1 -update 1 out/contact.jpg
      # The explainer publishes to explainer-video, the fix update to fix-video.
      - name: Publish to the video branch
        run: |
          BRANCH=$([ "$SCRIPT" = fix.json ] && echo fix-video || echo explainer-video)
          mkdir -p ../publish && cp "out/$NAME.mp4" "out/$NAME.srt" out/poster.jpg out/contact.jpg ../publish/
          cd ../publish
          printf '# %s\n\nProduced by explainer-video.yml from %s. Voice: %s.\n' "$NAME" "$SCRIPT" "${{ github.event.inputs.voice || 'af_heart' }}" > README.md
          git init -q -b "$BRANCH"
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "$NAME $(date -u +%F)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            media/explainer/out/${{ env.NAME }}.mp4
            media/explainer/out/${{ env.NAME }}.srt
            media/explainer/out/poster.jpg
            media/explainer/out/narration.wav
