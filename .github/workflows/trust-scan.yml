name: Trust Index scan

# Daily read-only scan of every resource in the CDP Bazaar with the
# pre-payment check. Results roll into a 30-day history, published as a
# single commit on the trust-data branch (rewritten each day, so the repo does
# not grow). The Doctor reads it for /api/trust and preflight's track record.
#
# GitHub drops scheduled runs when it is busy (on 24 Sep and 21 Oct the 03:17
# run never started), so the schedule fires four times a day and a scheduled run
# stops early once today's scan is published. Doctor also starts it from 04:15 UTC
# while it still serves the day before (lib/scan-watch.js), with only_if_missing,
# which stops early the same way. A manual run without it always scans.
on:
  schedule:
    - cron: "17 3,9,15,21 * * *" # 03:17, 09:17, 15:17, 21:17 UTC; the first that runs does the day
  workflow_dispatch:
    inputs:
      limit:
        description: "Scan only the first N resources (0 = all)"
        required: false
        default: "0"
      only_if_missing:
        description: "Stop if today's scan is already published (what Doctor sends)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: trust-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Already scanned today?
        id: today
        run: |
          done=$(git fetch --depth 1 origin trust-data 2>/dev/null && git show FETCH_HEAD:summary.json 2>/dev/null | jq -r '.date // empty' || true)
          echo "latest scan: ${done:-none}, today: $(date -u +%F)"
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.only_if_missing }}" = "true" ]; } && [ "$done" = "$(date -u +%F)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's scan is already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v5
        if: steps.today.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.today.outputs.skip != 'true'
      - name: Previous index
        if: steps.today.outputs.skip != 'true'
        run: |
          mkdir -p trust-data
          if git fetch --depth 1 origin trust-data 2>/dev/null; then
            git show FETCH_HEAD:index.json > trust-data/index.json || rm -f trust-data/index.json
            git show FETCH_HEAD:paytos.json > trust-data/paytos.json || rm -f trust-data/paytos.json
            git show FETCH_HEAD:paytos-solana.json > trust-data/paytos-solana.json 2>/dev/null || rm -f trust-data/paytos-solana.json
            git show FETCH_HEAD:submitted.json > trust-data/submitted.json || rm -f trust-data/submitted.json
          fi
          ls -la trust-data
      - name: Scan
        if: steps.today.outputs.skip != 'true'
        run: node scripts/trust-scan.js --out trust-data --limit "${{ github.event.inputs.limit || '0' }}"
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      - name: Categories (TypeSafe Jev)
        if: steps.today.outputs.skip != 'true'
        run: |
          { git fetch --depth 1 origin trust-data 2>/dev/null && git show FETCH_HEAD:categories.json > prev-categories.json 2>/dev/null; } || echo "{}" > prev-categories.json
          node scripts/categorize.js --index trust-data/index.json --previous prev-categories.json --out trust-data/categories.json --max 1500 --max-bait 1000
          [ -f trust-data/categories.json ] || cp prev-categories.json trust-data/categories.json
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      # One service name listed by several sellers (lib/namesakes.js): marks the namesakes in the index before the views
      # are built. A failure here must not stop the publish.
      - name: Namesakes (TypeSafe Jev)
        if: steps.today.outputs.skip != 'true'
        continue-on-error: true
        run: |
          { git fetch --depth 1 origin trust-data 2>/dev/null && git show FETCH_HEAD:namesakes.json > prev-namesakes.json 2>/dev/null; } || echo "{}" > prev-namesakes.json
          node scripts/namesakes.js --dir trust-data --previous prev-namesakes.json
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      # The small files the Doctor reads instead of the whole index. A failure here must not stop the publish: the
      # Doctor then keeps reading the previous views (or the full index).
      - name: Views for the Doctor
        if: steps.today.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/trust-views.js --dir trust-data
      - name: Publish to the trust-data branch
        if: steps.today.outputs.skip != 'true'
        run: |
          cd trust-data
          cat > README.md <<'MD'
          # x402 Trust Index data

          Written daily by `.github/workflows/trust-scan.yml` on `master`. `index.json`: 30-day history per
          resource (`days[]`, and per resource `h` with one letter per day: g go, c caution, n no-go,
          x unreachable, - not scanned); `index.ndjson` is the same index with one resource per line (a header line,
          then `[key, resource]`). `views/` and `keys/`: the same index as small precomputed files (the summary, the
          atlas, path templates, seller totals, the price check's word index, one view per network, and the resources in
          256 buckets by key), which the Doctor reads instead of the whole index (lib/trust-views.js,
          lib/trust-reader.js). `summary.json`: totals of the latest scan. `categories.json`: the kind of
          service per description (TypeSafe Jev, keyed by lib/services.js descKey). `paytos.json`: the payout addresses on
          Base and the day each was last seen, for the hourly on-chain payment count; `paytos-solana.json` the same for USDC
          payout addresses on Solana, with the facilitators that pay their fees (`fee_payers`). `namesakes.json`: brand names
          listed by more than one seller (lib/namesakes.js); the namesakes' resources carry `ns` in the index. `submitted.json`: the same history for
          endpoints their sellers added on Doctor (POST /api/trust/submit), kept apart from the registry listings in
          `index.json`. See https://x402-doctor.fizzl.eu/trust
          MD
          git init -q -b trust-data
          git add index.json index.ndjson summary.json categories.json paytos.json submitted.json README.md
          if [ -f namesakes.json ]; then git add namesakes.json; fi
          if [ -f paytos-solana.json ]; then git add paytos-solana.json; fi
          if [ -f views/meta.json ]; then git add views keys; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Trust index $(date -u +%F)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" trust-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        if: steps.today.outputs.skip != 'true'
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat trust-data/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
