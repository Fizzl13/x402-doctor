name: Trust Index scan

# Daily read-only scan of every resource in the CDP Bazaar with the
# pre-payment check. Results roll into a 30-day history, published as a
# single commit on the trust-data branch (rewritten each day, so the repo does
# not grow). The Doctor reads it for /api/trust and preflight's track record.
#
# GitHub drops scheduled runs when it is busy (on 24 Sep and 21 Oct the 03:17
# run never started), so the schedule fires four times a day and a scheduled run
# stops early once today's scan is published. Doctor also starts it from 04:15 UTC
# while it still serves the day before (lib/scan-watch.js), with only_if_missing,
# which stops early the same way. A manual run without it always scans.
#
# Three jobs (scripts/trust-scan.js): plan reads the catalogs once; scan runs in
# SHARES parallel jobs, each with whole sellers (by a hash of the host, so a seller
# still gets at most two requests at a time); publish merges the shares into the
# index and publishes it. In one job the scan took 57 minutes on 25 Oct 2026, twice
# the day before, and a job stops at 3 hours. A share that fails or runs out of time
# leaves its endpoints not checked that day ('-'); the rest is still published.
on:
  schedule:
    - cron: "17 3,9,15,21 * * *" # 03:17, 09:17, 15:17, 21:17 UTC; the first that runs does the day
  workflow_dispatch:
    inputs:
      limit:
        description: "Scan only the first N resources (0 = all)"
        required: false
        default: "0"
      only_if_missing:
        description: "Stop if today's scan is already published (what Doctor sends)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: trust-scan
  cancel-in-progress: false

env:
  SHARES: 4

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      skip: ${{ steps.today.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - name: Already scanned today?
        id: today
        run: |
          done=$(git fetch --depth 1 origin trust-data 2>/dev/null && git show FETCH_HEAD:summary.json 2>/dev/null | jq -r '.date // empty' || true)
          echo "latest scan: ${done:-none}, today: $(date -u +%F)"
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.only_if_missing }}" = "true" ]; } && [ "$done" = "$(date -u +%F)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's scan is already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v5
        if: steps.today.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.today.outputs.skip != 'true'
      - name: Plan
        if: steps.today.outputs.skip != 'true'
        run: |
          mkdir -p trust-data
          if git fetch --depth 1 origin trust-data 2>/dev/null; then
            git show FETCH_HEAD:submitted.json > trust-data/submitted.json || rm -f trust-data/submitted.json
          fi
          node scripts/trust-scan.js --plan plan/plan.json --out trust-data --limit "${{ github.event.inputs.limit || '0' }}"
      - uses: actions/upload-artifact@v4
        if: steps.today.outputs.skip != 'true'
        with:
          name: plan
          path: plan/plan.json
          retention-days: 3

  scan:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4] # SHARES
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: plan
      - name: Scan share ${{ matrix.share }}
        run: node scripts/trust-scan.js --shard "${{ matrix.share }}/$SHARES" --plan plan/plan.json --results "results/${{ matrix.share }}.json"
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.share }}
          path: results/${{ matrix.share }}.json
          retention-days: 3

  publish:
    needs: [plan, scan]
    # Also when a share failed: its endpoints count as not checked today. Not when the run was cancelled.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: plan
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Previous index
        run: |
          mkdir -p trust-data
          if git fetch --depth 1 origin trust-data 2>/dev/null; then
            bash scripts/trust-index-get.sh FETCH_HEAD trust-data || true
            git show FETCH_HEAD:paytos.json > trust-data/paytos.json || rm -f trust-data/paytos.json
            git show FETCH_HEAD:paytos-solana.json > trust-data/paytos-solana.json 2>/dev/null || rm -f trust-data/paytos-solana.json
            git show FETCH_HEAD:paytos-xrpl.json > trust-data/paytos-xrpl.json 2>/dev/null || rm -f trust-data/paytos-xrpl.json
            git show FETCH_HEAD:submitted.json > trust-data/submitted.json || rm -f trust-data/submitted.json
            git show FETCH_HEAD:delivery-nohumans.json > trust-data/delivery-nohumans.json 2>/dev/null || rm -f trust-data/delivery-nohumans.json
          fi
          ls -la trust-data results || true
      - name: Merge the shares
        run: node scripts/trust-scan.js --merge results --plan plan/plan.json --out trust-data
      - name: Categories (TypeSafe Jev)
        run: |
          { git fetch --depth 1 origin trust-data 2>/dev/null && git show FETCH_HEAD:categories.json > prev-categories.json 2>/dev/null; } || echo "{}" > prev-categories.json
          node scripts/categorize.js --index trust-data/index.json --previous prev-categories.json --out trust-data/categories.json --max 1500 --max-bait 1000
          [ -f trust-data/categories.json ] || cp prev-categories.json trust-data/categories.json
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      # One service name listed by several sellers (lib/namesakes.js): marks the namesakes in the index before the views
      # are built. A failure here must not stop the publish.
      - name: Namesakes (TypeSafe Jev)
        continue-on-error: true
        run: |
          { git fetch --depth 1 origin trust-data 2>/dev/null && git show FETCH_HEAD:namesakes.json > prev-namesakes.json 2>/dev/null; } || echo "{}" > prev-namesakes.json
          node scripts/namesakes.js --dir trust-data --previous prev-namesakes.json
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      # The small files the Doctor reads instead of the whole index. A failure here must not stop the publish: the
      # Doctor then keeps reading the previous views (or the full index).
      - name: Views for the Doctor
        continue-on-error: true
        run: node scripts/trust-views.js --dir trust-data
      - name: Publish to the trust-data branch
        run: |
          cd trust-data
          cat > README.md <<'MD'
          # x402 Trust Index data

          Written daily by `.github/workflows/trust-scan.yml` on `master`. `index/`: the 30-day history per resource,
          in parts that each stay far below GitHub's file size limit (`index/meta.json` has `days[]`, the count and the
          parts; each part `index/<nn>.ndjson` has one `[key, resource]` per line, and per resource `h` has one letter
          per day: g go, c caution, n no-go, x unreachable, - not scanned; lib/index-files.js). `index.json` (the whole
          index as one JSON) and `index.ndjson` (a header line, then the same lines) are published as well while they
          stay under 90 MB, and left out after that. `views/` and `keys/`: the same index as small precomputed files (the
          summary, the atlas, path templates, seller totals, the price check's word index, one view per network, a large
          one in parts as listed in `views/meta.json` `network_parts`, and the resources in 256 buckets by key), which
          the Doctor reads instead of the whole index (lib/trust-views.js, lib/trust-reader.js). `summary.json`: totals
          of the latest scan. `categories.json`: the kind of service per description (TypeSafe Jev, keyed by
          lib/services.js descKey). `paytos.json`: the payout addresses on Base and the day each was last seen, for the
          hourly on-chain payment count; `paytos-solana.json` the same for USDC payout addresses on Solana, with the
          facilitators that pay their fees (`fee_payers`), and `paytos-xrpl.json` for payout addresses on the XRP
          Ledger. `namesakes.json`: brand names listed by more than one seller (lib/namesakes.js); the namesakes'
          resources carry `ns` in the index. `submitted.json`: the same history for endpoints their sellers added on
          Doctor (POST /api/trust/submit), kept apart from the registry listings in the index. `delivery-nohumans.json`:
          the endpoints nohumans.directory bought with real USDC and got an answer from, by key, as [day of that
          purchase, the listing's status, its id] (from its CC BY 4.0 catalogue). See
          https://x402-doctor.fizzl.eu/trust
          MD
          # GitHub refuses a file over 100 MB in a push (and warns from 50 MB): say which, before the push fails.
          find . -type f -size +50M | while read -r f; do echo "::warning::$f is $(( $(stat -c %s "$f") / 1048576 )) MB (GitHub refuses files over 100 MB)"; done
          big=$(find . -type f -size +95M)
          if [ -n "$big" ]; then echo "::error::too large to publish: $big"; exit 1; fi
          git init -q -b trust-data
          git add index summary.json categories.json paytos.json submitted.json README.md
          for f in index.json index.ndjson namesakes.json paytos-solana.json paytos-xrpl.json delivery-nohumans.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if [ -f views/meta.json ]; then git add views keys; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Trust index $(date -u +%F)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" trust-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat trust-data/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
