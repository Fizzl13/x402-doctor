name: Index payment

# Payments to our own routes, so the CDP Bazaar lists them (scripts/index-payment.js). The Bazaar lists a route only
# after a payment for it settles and drops it after 30 days without one; directories that read the Bazaar follow it.
#
# Started by hand. "stale" pays each of our routes whose last settled payment in the Bazaar is "days" old or more (or
# that it does not list); otherwise "url" is paid once. Each payment costs at most the route's own price (see
# INDEX_PAYMENT.routes in lib/spot-buy.js; any other fizzl.eu URL $0.01), in USDC on Base, only to a fizzl.eu route
# and so to our own payout wallet, with the spot-buy wallet (the secret SPOT_BUY_KEY). It publishes nothing: the
# spot-buy results stay a sample of other sellers.
on:
  workflow_dispatch:
    inputs:
      stale:
        description: "Pay every route the Bazaar is about to drop (ignores url)"
        type: boolean
        default: true
      days:
        description: "With stale: pay routes whose last settled payment is this many days old or more"
        type: number
        default: 21
      url:
        description: "Without stale: the fizzl.eu route to pay once (https)"
        type: string
        default: "https://presign-guard.fizzl.eu/v1/screen?address=TNiq9AXBp9EjUqhDhrwrfvAA8U3GUQZH81"
      dry_run:
        description: "Dry run: everything up to the payment, nothing paid"
        type: boolean
        default: true

permissions:
  contents: read

# The same wallet as the spot-buy: never both at once (the charge is measured from the wallet's balance).
concurrency:
  group: spot-buy
  cancel-in-progress: false

jobs:
  pay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pay
        run: |
          dry=""
          if [ "$DRY_RUN" = "true" ]; then dry="--dry"; fi
          if [ "$STALE" = "true" ]; then
            node scripts/index-payment.js --stale --days "$DAYS" $dry
          else
            node scripts/index-payment.js --url "$TARGET_URL" $dry
          fi
        env:
          STALE: ${{ github.event.inputs.stale }}
          DAYS: ${{ github.event.inputs.days }}
          TARGET_URL: ${{ github.event.inputs.url }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SPOT_BUY_KEY: ${{ secrets.SPOT_BUY_KEY }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
