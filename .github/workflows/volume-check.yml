name: x402 volume check (one-off research)
on:
  push:
    branches: [research/x402-market]
    paths: ['scripts/x402-volume-check.mjs', '.github/workflows/volume-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/x402-volume-check.mjs
      - uses: actions/upload-artifact@v4
        with: { name: volume-check, path: volume-check.md }
