name: x402 volume check (one-off research)
on:
  push:
    branches: [research/x402-market]
    paths: ['scripts/fetch-page.mjs', '.github/workflows/volume-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { ref: master, path: doctor }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --omit=dev
      - run: node scripts/fetch-page.mjs
