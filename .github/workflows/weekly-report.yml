name: Weekly x402 health report

# Every Monday, after the daily Trust Index scan: a report of the week (numbers
# only, no seller named) plus drafts for X, Discord and Reddit that a person
# reviews and posts. Kept on the weekly-reports branch, one set of files per week.
on:
  schedule:
    - cron: "43 6 * * 1" # Mondays 06:43 UTC; the 03:17 Trust Index scan is done by then
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Report
        run: node scripts/weekly-report.js --out "$RUNNER_TEMP/new"
      - name: Publish to the weekly-reports branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin weekly-reports 2>/dev/null; then
            git checkout -q -B weekly-reports FETCH_HEAD
          else
            git checkout -q --orphan weekly-reports
            git rm -rqf .
          fi
          mkdir -p reports
          cp "$RUNNER_TEMP"/new/* reports/
          git add reports
          git commit -qm "Weekly report $(date -u +%F)" || echo "nothing new"
          git push -q origin weekly-reports
      - name: Summary
        run: cat "$RUNNER_TEMP"/new/*-posts.md >> "$GITHUB_STEP_SUMMARY"
